[project]
name = "marketing-roi-pipeline"
version = "0.1.0"
description = "ELT pipeline measuring CAC and LTV:CAC by marketing channel on Olist public data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
