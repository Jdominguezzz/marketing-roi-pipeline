version: 2

models:
  - name: stg_olist__leads
    description: One row per marketing-qualified lead (contract in docs/data_contracts.md).
    columns:
      - name: lead_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: first_contact_date
        data_tests:
          - not_null
      - name: channel
        description: Acquisition channel. NULL and 'unknown' unified as 'unknown'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [organic_search, paid_search, social, unknown, direct_traffic,
                         email, referral, other, display, other_publicities]

  - name: stg_olist__closed_deals
    description: One row per won deal. Lead, deal and seller are one-to-one.
    columns:
      - name: lead_id
        description: Primary key, and foreign key to the lead.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__leads')
                field: lead_id
      - name: seller_id
        data_tests:
          - unique
          - not_null
      - name: won_at
        data_tests:
          - not_null

  - name: stg_olist__orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced,
                         processing, created, approved]
      - name: purchased_at
        data_tests:
          - not_null

  - name: stg_olist__order_items
    description: One row per item within an order. Grain trap, see contract.
    columns:
      - name: order_item_key
        description: Surrogate key = order_id || '-' || order_item_number.
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: price_brl
        data_tests:
          - not_null

  - name: stg_olist__order_payments
    description: One row per payment within an order.
    columns:
      - name: order_payment_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

  - name: stg_olist__customers
    description: One row per customer PER ORDER. Use person_id for real people.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: person_id
        data_tests:
          - not_null

  - name: stg_olist__sellers
    description: One row per seller who sold at least once.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
